<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Control VideoBeam FET{% endblock %}</title>
  <style>
    :root {
      /* Colores institucionales de la FET (fet.edu.co) */
      --verde: #0f6635;
      --verde-oscuro: #072e18;
      --verde-titulo: #0c522a;
      --verde-claro: #e2ede7;
      --amarillo: #fedc03;
      --amarillo-texto: #6b5800;
      --amarillo-fondo: #fff7c2;
      --crema: #f5f5e6;
      --linea: #d9dccb;
      --texto: #1c2a21;
      --gris: #56635a;
      --alerta: #a8321f;
      --alerta-fondo: #fbe9e6;
      --numeros: Bahnschrift, "DIN Alternate", "Arial Narrow", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--texto);
      background: var(--crema);
    }
    a { color: var(--verde); font-weight: 600; }
    :focus-visible { outline: 3px solid var(--amarillo); outline-offset: 2px; }

    /* Encabezado */
    .barra { background: var(--verde); color: #fff; border-bottom: 5px solid var(--amarillo); }
    .barra-contenido {
      max-width: 1120px; margin: 0 auto; padding: 10px 20px;
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
    }
    .marca { display: flex; align-items: center; gap: 18px; }
    .marca img { height: 64px; width: auto; display: block; }
    .marca-texto { display: flex; flex-direction: column; padding-left: 18px; border-left: 1px solid #4f8f69; }
    .marca strong { font-family: var(--numeros); font-stretch: condensed; font-size: 24px; font-weight: 700; line-height: 1.1; }
    .marca span { font-size: 14px; color: #d4e7da; }
    .barra form { margin: 0; }
    .barra button {
      background: #fff; color: var(--verde-oscuro); border: 0; border-radius: 8px;
      padding: 8px 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .barra button:hover { background: var(--amarillo); }

    main { max-width: 1120px; margin: 0 auto; padding: 24px 20px 48px; }
    h2 { font-size: 20px; margin: 0 0 12px; }
    .nota { color: var(--gris); font-size: 14px; margin: 4px 0 0; }

    /* Avisos */
    .aviso { border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; border-left: 5px solid; }
    .aviso.exito { background: var(--verde-claro); color: var(--verde-titulo); border-color: var(--verde); }
    .aviso.error { background: var(--alerta-fondo); color: var(--alerta); border-color: var(--alerta); }

    /* Disponibilidad y estante de videobeams */
    .disponibilidad {
      font-family: var(--numeros); font-stretch: condensed; font-size: 40px; font-weight: 700;
      line-height: 1.1; color: var(--verde-titulo); margin: 4px 0 18px;
    }
    .disponibilidad.sin-disponibles { color: var(--alerta); }
    .estante {
      list-style: none; margin: 0 0 28px; padding: 0;
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
    }
    .equipo {
      background: #fff; border: 1px solid var(--linea); border-top: 8px solid var(--verde);
      border-radius: 4px; padding: 12px 14px 14px; min-height: 172px;
      display: flex; flex-direction: column;
    }
    .equipo.prestado { border-top-color: var(--amarillo); }
    .equipo-codigo {
      font-family: var(--numeros); font-size: 30px; font-weight: 600; line-height: 1;
      font-variant-numeric: tabular-nums; color: var(--verde-titulo);
    }
    .equipo-estado { font-weight: 700; font-size: 15px; margin: 6px 0 10px; }
    .libre .equipo-estado { color: var(--verde); }
    .prestado .equipo-estado { color: var(--amarillo-texto); }
    .equipo dl { margin: 0; font-size: 14px; }
    .equipo dt { color: var(--gris); }
    .equipo dd { margin: 0 0 4px; overflow-wrap: anywhere; }
    .equipo .vacio { color: var(--gris); font-size: 14px; margin-top: auto; }

    /* Listas que piden atención */
    .atencion {
      background: #fff; border: 1px solid var(--linea); border-left: 6px solid var(--alerta);
      border-radius: 6px; padding: 16px 18px; margin-bottom: 20px;
    }
    .atencion.hdmi { border-left-color: var(--amarillo); }
    .atencion h2 { color: var(--alerta); }
    .atencion.hdmi h2 { color: var(--amarillo-texto); }

    /* Formularios */
    .columnas { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
    .panel { background: #fff; border: 1px solid var(--linea); border-radius: 8px; padding: 20px; }
    .panel h2, .registro h2 { color: var(--verde-titulo); }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 15px; }
    input, select {
      width: 100%; padding: 9px 10px; border: 1px solid #b7c0cc; border-radius: 6px;
      font: inherit; background: #fff;
    }
    input:focus, select:focus { border-color: var(--verde); }
    label.casilla { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-top: 16px; }
    label.casilla input { width: 20px; height: 20px; margin: 0; accent-color: var(--verde); }
    button.principal {
      margin-top: 18px; width: 100%; background: var(--verde); color: #fff; border: 0;
      border-radius: 8px; padding: 12px; font: inherit; font-weight: 700; cursor: pointer;
    }
    button.principal:hover { background: var(--verde-titulo); }
    button.principal:disabled { background: #b7c0cc; cursor: not-allowed; }
    button.secundario {
      background: var(--amarillo); color: var(--verde-oscuro); border: 0; border-radius: 8px;
      padding: 6px 10px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    button.secundario:hover { background: #ecc900; }

    /* Tablas */
    .tabla { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th {
      text-align: left; font-size: 13px; font-weight: 600; color: var(--gris);
      padding: 8px 10px; border-bottom: 2px solid var(--linea); white-space: nowrap;
    }
    td { padding: 10px; border-bottom: 1px solid #e6eaef; vertical-align: top; }
    td.codigo { font-family: var(--numeros); font-weight: 700; color: var(--verde-titulo); white-space: nowrap; }
    td.hora { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .marca-estado {
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 600;
      background: var(--amarillo-fondo); color: var(--amarillo-texto); white-space: nowrap;
    }
    .registro { background: #fff; border: 1px solid var(--linea); border-radius: 8px; padding: 20px; }

    @media (max-width: 960px) {
      .estante { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 720px) {
      .marca img { height: 48px; }
      .marca-texto { padding-left: 12px; }
      .estante { grid-template-columns: repeat(2, 1fr); }
      .columnas, .fila { grid-template-columns: 1fr; }
      .disponibilidad { font-size: 28px; }
    }

    /* Inicio de sesión */
    .acceso { max-width: 420px; margin: 48px auto; }
  </style>
</head>
