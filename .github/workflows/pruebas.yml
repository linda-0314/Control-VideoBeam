name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt pip-audit coverage

      - name: Clave secreta solo para esta ejecución
        run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"

      - name: Linter (ruff)
        run: ruff check .

      - name: Pruebas (pytest) con cobertura
        run: coverage run -m pytest

      - name: Cobertura de la lógica del negocio
        run: coverage report --include="prestamos/reglas.py,prestamos/registro.py"

      - name: Auditoría de dependencias (pip-audit)
        run: pip-audit -r requirements.txt