[project]
name = "control-videobeam-fet"
version = "0.3.0"
description = "Control de préstamos de los videobeams de la biblioteca de la FET"
requires-python = ">=3.10"
authors = [{ name = "Linda Paola Carreño Meneses" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# E: estilo, F: errores, B: errores probables (bugbear), S: seguridad (bandit)
select = ["E", "F", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: assert es la forma normal de comprobar resultados en pytest.
# S106: la contraseña del usuario de prueba solo existe en la base en memoria
# de las pruebas. Las dos se permiten solo en tests/; en la app siguen activas.
"tests/*" = ["S101", "S106"]
