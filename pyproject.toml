[project]
name = "control-videobeam-fet"
version = "0.2.0"
description = "Control de préstamos de los videobeams de la biblioteca de la FET"
requires-python = ">=3.10"
authors = [{ name = "Linda Paola Carreño Meneses" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# E: estilo, F: errores, B: errores probables (bugbear), S: seguridad (bandit)
select = ["E", "F", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: assert es la forma normal de comprobar resultados en pytest.
# Solo se permite en las pruebas; en el código de la app sigue activo.
"tests/*" = ["S101"]
